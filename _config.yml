# Site settings
title: VT Robotics
tagline: Robotics at Virginia Tech
description: >-
  Virginia Tech Robotics creates hardware and algorithms for intelligent systems
  that will change the world. Meet our faculty and explore their labs.
url: "https://robotics.me.vt.edu"
baseurl: ""
lang: en

# Build settings (both plugins are supported by GitHub Pages)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - logo        # original logo files; the site uses _includes/logo.svg and assets/images/favicon.svg
